name: MotoCam APK Olustur

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: ZIP dosyasini ac
        run: |
          unzip MotoCam_1.0_Full_Android.zip -d motocam
          ls -la motocam

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK derle
        working-directory: motocam
        run: gradle assembleDebug

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: MotoCam-APK
          path: motocam/app/build/outputs/apk/debug/app-debug.apk
