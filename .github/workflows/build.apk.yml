name: MotoCam APK Olustur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK hazirla
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: MotoCam ZIP dosyasini ac
        run: |
          rm -rf motocam
          mkdir motocam
          unzip -q MotoCam_1.0_Full_Android.zip -d motocam

      - name: Sesli komut bip sesini bastir ve zil modunu koru
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kt = Path("motocam/app/src/main/java/com/motocam/app/MainActivity.kt")
          text = kt.read_text(encoding="utf-8")

          text = text.replace('                    restartVoiceSoon()\n', '                    restartVoiceSoon(1800)\n', 1)
          text = text.replace('                    if (voiceWanted) restartVoiceSoon(650)\n', '                    if (voiceWanted) restartVoiceSoon(2200)\n', 1)
          text = text.replace('            putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true)\n', '', 1)
          text = text.replace('    private fun restartVoiceSoon(delayMs: Long = 400L) {\n', '    private fun restartVoiceSoon(delayMs: Long = 1800L) {\n', 1)

          marker = '            putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)\n'
          if marker in text and 'EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS' not in text:
              text = text.replace(marker, marker +
                  '            putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 300000L)\n'
                  '            putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 300000L)\n'
                  '            putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS, 300000L)\n', 1)

          old_cancel_start = '            speechRecognizer?.cancel()\n            speechRecognizer?.startListening(intent)\n'
          old_start = '            speechRecognizer?.startListening(intent)\n'
          new_start = '            muteVoiceSystemBeeps()\n            speechRecognizer?.startListening(intent)\n'
          if old_cancel_start in text:
              text = text.replace(old_cancel_start, new_start, 1)
          elif old_start in text:
              text = text.replace(old_start, new_start, 1)

          fn_marker = '    private fun restartVoiceSoon('
          helper = '''    private var savedSystemVolume: Int? = null\n    private var savedRingerMode: Int? = null\n\n    private fun muteVoiceSystemBeeps() {\n        try {\n            val audio = getSystemService(AUDIO_SERVICE) as android.media.AudioManager\n            val stream = android.media.AudioManager.STREAM_SYSTEM\n            if (savedSystemVolume == null) savedSystemVolume = audio.getStreamVolume(stream)\n            if (savedRingerMode == null) savedRingerMode = audio.ringerMode\n            if (audio.getStreamVolume(stream) != 0) {\n                audio.setStreamVolume(stream, 0, android.media.AudioManager.FLAG_REMOVE_SOUND_AND_VIBRATE)\n            }\n            savedRingerMode?.let { originalMode ->\n                if (audio.ringerMode != originalMode) {\n                    try { audio.ringerMode = originalMode } catch (_: Exception) {}\n                }\n            }\n        } catch (_: Exception) {}\n    }\n\n    private fun restoreVoiceSystemBeeps() {\n        try {\n            val audio = getSystemService(AUDIO_SERVICE) as android.media.AudioManager\n            val stream = android.media.AudioManager.STREAM_SYSTEM\n            savedSystemVolume?.let { audio.setStreamVolume(stream, it, android.media.AudioManager.FLAG_REMOVE_SOUND_AND_VIBRATE) }\n            savedRingerMode?.let { originalMode ->\n                if (audio.ringerMode != originalMode) {\n                    try { audio.ringerMode = originalMode } catch (_: Exception) {}\n                }\n            }\n            savedSystemVolume = null\n            savedRingerMode = null\n        } catch (_: Exception) {}\n    }\n\n'''
          if fn_marker in text and 'private fun muteVoiceSystemBeeps' not in text:
              text = text.replace(fn_marker, helper + fn_marker, 1)

          if 'override fun onDestroy() {' in text:
              target = 'override fun onDestroy() {\n        restoreVoiceSystemBeeps()'
              if target not in text:
                  text = text.replace('override fun onDestroy() {', 'override fun onDestroy() {\n        restoreVoiceSystemBeeps()', 1)
          else:
              idx = text.rfind('\n}')
              if idx != -1:
                  text = text[:idx] + '''\n\n    override fun onDestroy() {\n        restoreVoiceSystemBeeps()\n        try { speechRecognizer?.destroy() } catch (_: Exception) {}\n        super.onDestroy()\n    }\n''' + text[idx:]

          kt.write_text(text, encoding="utf-8")

          manifest = Path("motocam/app/src/main/AndroidManifest.xml")
          m = manifest.read_text(encoding="utf-8")
          perm = '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          if perm not in m:
              manifest_start = m.find('<manifest')
              manifest_end = m.find('>', manifest_start)
              if manifest_start != -1 and manifest_end != -1:
                  m = m[:manifest_end+1] + '\n    ' + perm + m[manifest_end+1:]
              else:
                  raise SystemExit('AndroidManifest.xml manifest etiketi bulunamadi')
          manifest.write_text(m, encoding="utf-8")

          print("MotoCam v1.4 bip bastirma + zil modu koruma uygulandi.")
          PY

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: MotoCam APK derle
        working-directory: motocam
        run: gradle assembleDebug --stacktrace

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: MotoCam-v1.4-APK
          path: motocam/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
