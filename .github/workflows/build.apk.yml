name: MotoCam APK Olustur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK hazirla
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: MotoCam ZIP dosyasini ac
        run: |
          rm -rf motocam
          mkdir motocam
          unzip -q MotoCam_1.0_Full_Android.zip -d motocam

      - name: v1.5 kaynak tanilama
        run: |
          echo '===== MainActivity.kt ====='
          cat motocam/app/src/main/java/com/motocam/app/MainActivity.kt
          echo '===== app build files ====='
          find motocam/app -maxdepth 1 -type f -name 'build.gradle*' -print -exec cat {} \;

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: MotoCam APK derle
        working-directory: motocam
        run: gradle assembleDebug --stacktrace

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: MotoCam-v1.5-diagnostic
          path: motocam/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
