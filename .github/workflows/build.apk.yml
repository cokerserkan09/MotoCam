name: MotoCam APK Olustur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK hazirla
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: MotoCam ZIP dosyasini ac
        run: |
          rm -rf motocam
          mkdir motocam
          unzip -q MotoCam_1.0_Full_Android.zip -d motocam

      - name: Vosk Turkce modelini ekle
        run: |
          curl -L --fail --retry 3 -o /tmp/vosk-tr.zip https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip
          rm -rf /tmp/vosk-tr
          mkdir -p /tmp/vosk-tr motocam/app/src/main/assets/model-tr
          unzip -q /tmp/vosk-tr.zip -d /tmp/vosk-tr
          cp -R /tmp/vosk-tr/vosk-model-small-tr-0.3/. motocam/app/src/main/assets/model-tr/
          test -f motocam/app/src/main/assets/model-tr/conf/model.conf

      - name: Vosk surekli sesli komutu uygula
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          kt = Path("motocam/app/src/main/java/com/motocam/app/MainActivity.kt")
          text = kt.read_text(encoding="utf-8")

          for line in [
              'import android.speech.RecognitionListener\n',
              'import android.speech.RecognizerIntent\n',
              'import android.speech.SpeechRecognizer\n',
          ]:
              text = text.replace(line, '')

          text = text.replace(
              '    private var speechRecognizer: SpeechRecognizer? = null\n    private var voiceWanted = true\n',
              '    private var voskModel: org.vosk.Model? = null\n'
              '    private var speechService: org.vosk.android.SpeechService? = null\n'
              '    private var voiceInitStarted = false\n'
              '    private var lastVoiceCommandMs = 0L\n'
              '    private var voiceWanted = true\n'
          )

          start = text.find('    private fun startVoiceControl() {')
          end = text.find('    private fun tryRouteBluetoothMic() {', start)
          if start == -1 or end == -1:
              raise SystemExit('Sesli komut blogu bulunamadi')

          replacement_b64 = ''
          replacement = base64.b64decode(replacement_b64).decode('utf-8')
          text = text[:start] + replacement + text[end:]

          text = text.replace(
              '        speechRecognizer?.destroy()\n        speechRecognizer = null\n',
              '        stopVoiceControl()\n        try { voskModel?.close() } catch (_: Exception) {}\n        voskModel = null\n'
          )
          kt.write_text(text, encoding='utf-8')

          gradle = Path('motocam/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          if 'com.alphacephei:vosk-android' not in g:
              g = g.replace(
                  'dependencies {\n',
                  'dependencies {\n'
                  '    implementation("net.java.dev.jna:jna:5.13.0@aar")\n'
                  '    implementation("com.alphacephei:vosk-android:0.3.47@aar")\n'
              )
          g = g.replace('versionCode = 2', 'versionCode = 5')
          g = g.replace('versionName = "1.0.0"', 'versionName = "1.5.0"')
          gradle.write_text(g, encoding='utf-8')

          manifest = Path('motocam/app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          m = m.replace('    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n', '')
          manifest.write_text(m, encoding='utf-8')
          print('MotoCam v1.5 Vosk surekli dinleme uygulandi.')
          PY

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: MotoCam v1.5 APK derle
        working-directory: motocam
        run: gradle assembleDebug --stacktrace

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: MotoCam-v1.5-APK
          path: motocam/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
